version: '3.8'

services:
  traffic-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_management_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
